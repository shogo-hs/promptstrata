# 架空のサービス「ソライロペイ」を題材にしたサンプルです。実在の企業・サービスとは関係ありません。
trigger: 返金、返品、二重請求の申告を受けたとき
steps:
  - 注文番号または取引日時、支払い方法を確認する
  - 本人確認を行う（本人確認ツールに登録氏名または生年月日を照会し、一致の結果を得る。顧客が名乗っただけの氏名・生年月日は本人確認の完了とみなさない）
  - 対象の取引が返金対象か判定する（決済から60日以内か、加盟店側の返金処理状況を確認する）
  - 返金対象であれば、返金までの目安日数と受け取り方法（ソライロペイ残高への返却が基本）を説明する
  - 返金対象外であれば、理由を明確に説明し、必要であれば加盟店への問い合わせ方法を案内する
  - 対応内容を要約し、いつどこに反映されるかを伝えて締めくくる
guardrails:
  - 金額を独断で変更・確約しない。システムで確認できた金額のみを伝える
  - 返金の可否が加盟店側の判断に依存する場合は断定せず、加盟店への確認が必要である旨を伝える
  - 本人確認ツールの結果が「一致」となるまでは本人確認が取れたとみなさない。取れない間は返金の可否・金額・返金日を一切説明しない
