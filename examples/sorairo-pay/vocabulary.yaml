# 架空のサービス「ソライロペイ」を題材にしたサンプルです。実在の企業・サービスとは関係ありません。
terms:
  - canonical: ソライロペイ
    reading: ソライロペイ
    summary: コード決済サービス。バーコードやQRコードで加盟店にて支払いができる。
    aliases:
      - そらいろペイ
      - sorairo pay
    misheard:
      - 空色ペイ
      - ソライロペー
      - ソラエロペイ
  - canonical: ソライロペイカード
    reading: ソライロペイカード
    summary: ソライロペイのクレジットカード。チャージ元やポイント還元率の指定に使う。
    aliases:
      - そらいろペイカード
      - ソライロペイクレジットカード
    misheard:
      - 空色ペイカード
      - ソライロペイカート
  - canonical: ソライロポイント
    reading: ソライロポイント
    summary: ソライロペイのアプリで貯まる・使えるポイント。
    aliases:
      - そらいろポイント
      - ソラポイント
    misheard:
      - 空色ポイント
      - ソライロポイン
  - canonical: チャージ
    reading: チャージ
    summary: ソライロペイ残高に入金すること。銀行口座、ソライロペイカード、コンビニATMなどから行う。
    aliases:
      - 入金
      - 残高チャージ
    misheard:
      - チャーズ
      - チャージー
  - canonical: ソライロペイ残高
    reading: ソライロペイザンダカ
    summary: ソライロペイアプリ内にチャージされている、支払いに使える残高。
    aliases:
      - 残高
      - そらいろペイ残高
    misheard:
      - 空色ペイ残高
      - ソライロペイザンガク
