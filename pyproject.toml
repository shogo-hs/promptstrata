[project]
name = "promptstrata"
version = "0.1.0"
description = "カスタマーサポート AI エージェントのシステムプロンプトを、レイヤーごとの YAML から合成する"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["prompt", "llm", "customer-support", "voice-agent", "system-prompt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
promptstrata = "promptstrata.cli:main"

[project.urls]
Homepage = "https://github.com/shogo-hs/promptstrata"
Repository = "https://github.com/shogo-hs/promptstrata"
Changelog = "https://github.com/shogo-hs/promptstrata/blob/main/CHANGELOG.md"
Issues = "https://github.com/shogo-hs/promptstrata/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptstrata"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
